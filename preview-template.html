<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$title$</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,400&family=Source+Sans+3:wght@400;600;700&display=swap');
:root {
  --text: #1a1a2e;
  --bg: #fafaf8;
  --accent: #2d5a7b;
  --accent-light: #e8f0f6;
  --border: #d4d4d4;
  --subtle: #6b7280;
  --callout-bg: #fef3c7;
  --callout-border: #f59e0b;
  --max-w: 52rem;
}
*, *::before, *::after { box-sizing: border-box; }
body {
  font-family: 'Source Serif 4', Georgia, serif;
  color: var(--text);
  background: var(--bg);
  line-height: 1.72;
  margin: 0;
  padding: 2rem 1.5rem 4rem;
  font-size: 1.05rem;
}
.content-wrap {
  max-width: var(--max-w);
  margin: 0 auto;
}
h1, h2, h3, h4 {
  font-family: 'Source Sans 3', system-ui, sans-serif;
  color: var(--accent);
  margin-top: 2.5rem;
  margin-bottom: 0.75rem;
  line-height: 1.25;
}
h1 {
  font-size: 2.2rem;
  border-bottom: 3px solid var(--accent);
  padding-bottom: 0.5rem;
  margin-top: 0;
}
h2 {
  font-size: 1.55rem;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.35rem;
}
h3 { font-size: 1.2rem; color: var(--text); }
h4 { font-size: 1.08rem; }
p { margin: 0.75rem 0; }
strong { color: var(--text); }
blockquote {
  border-left: 4px solid var(--callout-border);
  background: var(--callout-bg);
  margin: 1.25rem 0;
  padding: 0.75rem 1.25rem;
  border-radius: 0 6px 6px 0;
}
table {
  width: 100%;
  border-collapse: collapse;
  margin: 1.25rem 0;
  font-size: 0.95rem;
  font-family: 'Source Sans 3', system-ui, sans-serif;
}
th {
  background: var(--accent);
  color: #fff;
  font-weight: 600;
  text-align: left;
  padding: 0.6rem 0.85rem;
}
td {
  padding: 0.55rem 0.85rem;
  border-bottom: 1px solid var(--border);
}
tr:nth-child(even) td { background: var(--accent-light); }
ul, ol { padding-left: 1.5rem; }
li { margin: 0.35rem 0; }
li strong { font-family: 'Source Sans 3', system-ui, sans-serif; }
code {
  font-size: 0.9em;
  background: #f0f0f0;
  padding: 0.15em 0.35em;
  border-radius: 3px;
}
hr { border: none; border-top: 1px solid var(--border); margin: 2rem 0; }
nav#TOC {
  background: var(--accent-light);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 1rem 1.5rem;
  margin: 0 0 2rem;
}
nav#TOC > ul { list-style: none; padding-left: 0; }
nav#TOC ul ul { padding-left: 1.25rem; }
nav#TOC a { color: var(--accent); text-decoration: none; }
nav#TOC a:hover { text-decoration: underline; }

/* Callout boxes */
.callout {
  margin: 1.5rem 0;
  padding: 1rem 1.25rem;
  border-left: 4px solid var(--callout-border);
  background: var(--callout-bg);
  border-radius: 0 6px 6px 0;
  font-family: 'Source Sans 3', system-ui, sans-serif;
  font-size: 0.95rem;
}
.callout p { margin: 0.4rem 0; }
.callout p:first-child { margin-top: 0; }
.callout p:last-child { margin-bottom: 0; }
.callout strong { color: #92400e; }

/* Summary boxes */
.summary {
  margin: 1.75rem 0;
  padding: 1.15rem 1.5rem;
  background: var(--accent-light);
  border: 1px solid #b8d4e8;
  border-radius: 8px;
  font-family: 'Source Sans 3', system-ui, sans-serif;
  font-size: 0.93rem;
  line-height: 1.6;
}
.summary p { margin: 0.35rem 0; max-width: none; }
.summary p:first-child { margin-top: 0; font-weight: 700; color: var(--accent); font-size: 1rem; }
.summary ul { max-width: none; margin: 0.5rem 0; padding-left: 1.25rem; }
.summary li { margin: 0.25rem 0; }

/* Quick-check lists */
.quick-check {
  margin: 1.5rem 0;
  padding: 1rem 1.25rem;
  background: #f0fdf4;
  border: 1px solid #86efac;
  border-radius: 8px;
  font-family: 'Source Sans 3', system-ui, sans-serif;
  font-size: 0.93rem;
  line-height: 1.6;
}
.quick-check p { margin: 0.35rem 0; max-width: none; }
.quick-check p:first-child { margin-top: 0; font-weight: 700; color: #166534; font-size: 1rem; }
.quick-check ul { max-width: none; margin: 0.5rem 0; padding-left: 1.25rem; list-style: none; }
.quick-check li { margin: 0.25rem 0; }
.quick-check li::before { content: "\2610\0020"; }
</style>
</head>
<body>
<div class="content-wrap">
$body$
</div>
</body>
</html>
